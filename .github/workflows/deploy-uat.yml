name: Deploy UAT (gated — requires human approval)

# This is the pipeline's human checkpoint for UAT promotion, enforced by
# GitHub itself: the "uat" environment below must have required reviewers
# configured (Settings -> Environments -> uat -> Required reviewers).
# The job will not run until a human approves it in GitHub's UI.

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Dev preview URL that passed smoke tests"
        required: true

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    environment: uat   # <-- required-reviewer gate lives on this environment
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Replace uat.example.vercel.app below with your actual UAT alias domain.
      - name: Promote preview to UAT alias
        run: vercel alias set "${{ github.event.inputs.preview_url }}" uat.example.vercel.app --token=${{ secrets.VERCEL_TOKEN }}

      # UAT Coordinator agent picks this up and opens the uat-checklist issue.
      - name: Emit uat_deploy_ready event
        run: echo uat_deploy_ready https://uat.example.vercel.app
