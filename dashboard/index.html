<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RetroDev Synapse — Pipeline Dashboard</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0e14; overflow: hidden; font-family: 'Courier New', monospace; height: 100%; }
  #app { display: flex; flex-direction: row; height: 100vh; box-sizing: border-box; padding-top: 40px; padding-bottom: 28px; }
  #app.banner-hidden { padding-top: 0; }
  #game-container { flex: 1 1 auto; min-width: 0; position: relative; overflow: hidden; }
  #sidebar {
    flex: 0 0 360px; width: 360px; display: flex; flex-direction: column;
    border-left: 2px solid #2d3748; background: #0b0e14; overflow: hidden;
  }
  #ticker {
    position: fixed; left: 0; right: 0; bottom: 0; height: 28px;
    background: #000; color: #4ade80; font-size: 13px; line-height: 28px;
    white-space: nowrap; overflow: hidden; border-top: 2px solid #4ade80; z-index: 20;
  }
  #ticker span { display: inline-block; padding-left: 100%; animation: scroll-left 18s linear infinite; }
  @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
  #waiting-banner {
    position: fixed; top: 0; left: 0; right: 0; padding: 10px; text-align: center;
    background: rgba(220,38,38,0.85); color: #fff; font-weight: bold; letter-spacing: 1px;
    display: none; z-index: 21;
  }
  #submit-panel {
    flex: 0 0 auto; background: #0f1420; border-bottom: 2px solid #2d3748; padding: 12px;
    font-family: 'Courier New', monospace; color: #e2e8f0;
  }
  #submit-panel h3 { margin: 0 0 8px; font-size: 13px; color: #4ade80; }
  #submit-panel textarea, #submit-panel input {
    width: 100%; box-sizing: border-box; background: #000; color: #e2e8f0;
    border: 1px solid #2d3748; font-family: inherit; font-size: 12px; padding: 6px; margin-bottom: 6px;
  }
  #submit-panel button {
    width: 100%; background: #4ade80; color: #000; border: none; padding: 8px;
    font-family: inherit; font-weight: bold; cursor: pointer;
  }
  #submit-panel button:disabled { opacity: 0.5; cursor: default; }
  #submit-status { font-size: 11px; margin-top: 6px; min-height: 14px; }

  #confirm-panel {
    flex: 0 0 auto; max-height: 45%; overflow-y: auto;
    background: #1a0f0f; border-bottom: 2px solid #f87171; padding: 12px;
    font-family: 'Courier New', monospace; color: #fecaca; display: none;
  }
  #confirm-panel .item.answered { opacity: 0.6; }
  #confirm-panel .flagged {
    display: inline-block; background: #4ade80; color: #000; font-weight: bold;
    font-size: 10px; padding: 2px 6px; letter-spacing: 0.5px; margin-bottom: 4px;
  }
  #confirm-panel .badge {
    display: inline-block; background: #f87171; color: #000; font-weight: bold;
    font-size: 11px; padding: 3px 8px; letter-spacing: 1px; margin-bottom: 8px;
    animation: pulse-badge 1.4s ease-in-out infinite;
  }
  @keyframes pulse-badge { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  #confirm-panel .item { border-top: 1px solid #7f1d1d; padding-top: 8px; margin-top: 8px; }
  #confirm-panel .item:first-of-type { border-top: none; margin-top: 0; }
  #confirm-panel .title { font-size: 12px; color: #fff; margin-bottom: 4px; }
  #confirm-panel .snippet { font-size: 11px; color: #fca5a5; white-space: pre-wrap; max-height: 90px; overflow-y: auto; margin-bottom: 6px; }
  #confirm-panel textarea {
    width: 100%; box-sizing: border-box; background: #000; color: #e2e8f0;
    border: 1px solid #7f1d1d; font-family: inherit; font-size: 12px; padding: 6px; margin-bottom: 6px;
  }
  #confirm-panel button {
    background: #f87171; color: #000; border: none; padding: 6px 10px;
    font-family: inherit; font-weight: bold; cursor: pointer; font-size: 11px;
  }
  #confirm-panel a { color: #fca5a5; }
  #confirm-panel .status { font-size: 10px; margin-top: 4px; min-height: 12px; }

  /* ChatDev-style dialogue transcript: persistent log of every agent
     turn, colored per role, vs. the transient in-room speech bubbles
     Phaser draws on the map itself. */
  #dialogue-panel { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  #dialogue-panel h3 {
    margin: 0; padding: 10px 12px; font-size: 13px; color: #4ade80;
    border-bottom: 2px solid #2d3748; background: #0f1420; flex: 0 0 auto;
  }
  #dialogue-log { flex: 1 1 auto; overflow-y: auto; padding: 10px; }
  #dialogue-log .msg { margin-bottom: 10px; }
  #dialogue-log .role {
    display: inline-block; font-size: 11px; font-weight: bold; color: #000;
    padding: 2px 8px; border-radius: 2px; margin-bottom: 3px;
  }
  #dialogue-log .bubble {
    background: #161b26; border-left: 3px solid #2d3748; padding: 8px 10px;
    font-size: 12px; color: #e2e8f0; white-space: pre-wrap;
  }
  #dialogue-log .ts { font-size: 9px; color: #64748b; margin-left: 6px; }
</style>
</head>
<body>
<div id="waiting-banner"></div>
<div id="app">
  <div id="game-container"></div>
  <div id="sidebar">
    <div id="submit-panel">
      <h3>SUBMIT REQUIREMENT</h3>
      <textarea id="req-input" rows="3" placeholder="What should the pipeline build?"></textarea>
      <input id="secret-input" type="password" placeholder="operator secret (saved locally)" />
      <button id="req-submit">Send to Product Manager</button>
      <div id="submit-status"></div>
    </div>
    <div id="confirm-panel">
      <div class="badge">⚠ REQUIRES YOUR CONFIRMATION</div>
      <div id="confirm-items"></div>
    </div>
    <div id="dialogue-panel">
      <h3>AGENT DIALOGUE LOG</h3>
      <div id="dialogue-log"></div>
    </div>
  </div>
</div>
<div id="ticker"><span id="ticker-text">RetroDev Synapse online — waiting for pipeline events...</span></div>

<!-- Phaser 3, free/MIT. Swap to a pinned local copy before production use. -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script>
/*
 * Retro pipeline dashboard skeleton (Phase 3 of PROGRESS.md).
 *
 * Rooms are placeholder colored rectangles + labels for now — swap in
 * Kenney.nl (CC0) tile/sprite sheets and a Tiled-exported map once the
 * real webhook relay (Phase 4) is wired up. The event feed below is a
 * MOCK to prove the rendering model end-to-end; replace `mockEventFeed`
 * with a WebSocket listener pointed at the Cloudflare Workers relay from
 * MANIFEST_PLAN_V5.md §5 / V6.md §5.
 */

// Desk anchors sit in the WORK_ZONE (left/center of the floor); the break
// room (coffee machine + benches) is a separate area to the right -- see
// BREAK_ZONE in PipelineScene.wander().
const ROOMS = [
  { key: 'planning_deck',    label: 'Planning Deck',    agent: 'Product Manager', name: 'Priya', charKey: 'char_priya', color: 0x3b82f6, x: 160, y: 150 },
  { key: 'design_studio',    label: 'Design Studio',    agent: 'Designer',        name: 'Dara',  charKey: 'char_dara',  color: 0x14b8a6, x: 300, y: 150 },
  { key: 'code_vault',       label: 'Code Vault',       agent: 'Developer',       name: 'Dev',   charKey: 'char_dev',   color: 0xf59e0b, x: 440, y: 150 },
  { key: 'sandbox_lab',      label: 'Sandbox Lab',      agent: 'QA Tester',       name: 'Quinn', charKey: 'char_quinn', color: 0xef4444, x: 580, y: 150 },
  { key: 'deploy_bay',       label: 'Deploy Bay',       agent: 'DevOps',          name: 'Devon', charKey: 'char_devon', color: 0x8b5cf6, x: 230, y: 330 },
  { key: 'uat_lounge',       label: 'UAT Lounge',       agent: 'UAT Coordinator', name: 'Uma',   charKey: 'char_uma',   color: 0x06b6d4, x: 370, y: 330 },
  { key: 'broadcast_studio', label: 'Broadcast Studio', agent: 'Social Expert',   name: 'Sasha', charKey: 'char_sasha', color: 0xec4899, x: 510, y: 330 },
];

const WORK_ZONE  = { cx: 370, cy: 260, w: 540, h: 380 };
const BREAK_ZONE = { cx: 745, cy: 285, w: 170, h: 400, minX: 670, maxX: 820, minY: 130, maxY: 470 };

class PipelineScene extends Phaser.Scene {
  constructor() { super('pipeline'); }

  preload() {
    // Real CC0 pixel art (Kenney's Tiny Dungeon pack, cropped) -- see
    // assets/CREDITS.md. Root-absolute paths (not "assets/...") because
    // "/" is served via a Vercel rewrite to this same file -- a relative
    // path there resolves against "/" instead of "/dashboard/", 404ing
    // every image and leaving Phaser's default missing-texture tile in
    // its place. Falls back gracefully to nothing drawn if a file still
    // 404s, rather than breaking the scene.
    ROOMS.forEach(room => this.load.image(room.charKey, `/dashboard/assets/characters/${room.name.toLowerCase()}.png`));
    this.load.image('floor_tile', '/dashboard/assets/tiles/floor_sand.png');
    this.load.image('furniture_dresser', '/dashboard/assets/tiles/dresser.png');
    this.load.image('furniture_desk', '/dashboard/assets/tiles/furniture_2.png');
  }

  create() {
    this.roomSprites = {};
    this.bubbles = {};
    this.createPixelTextures();

    // One continuous open-plan office floor -- no per-room walls, so agents
    // can freely wander over to each other's desks instead of being stuck
    // in separate boxes, like the ChatDev reference office.
    this.add.tileSprite(0, 0, this.scale.width, this.scale.height, 'floor_tile').setOrigin(0, 0).setDepth(0);

    this.add.text(20, 16, 'RETRODEV SYNAPSE — LIVE PIPELINE', {
      fontFamily: 'Courier New', fontSize: '20px', color: '#4ade80'
    }).setDepth(1000);

    // Two visually distinct zones, like a real office: a work zone (desks
    // in rows) and a separate break room (coffee machine + benches) --
    // agents physically walk between the two instead of everything
    // happening in one spot.
    this.add.rectangle(WORK_ZONE.cx, WORK_ZONE.cy, WORK_ZONE.w, WORK_ZONE.h, 0x14532d, 0.15).setDepth(1);
    this.add.rectangle(BREAK_ZONE.cx, BREAK_ZONE.cy, BREAK_ZONE.w, BREAK_ZONE.h, 0x1e3a5f, 0.28).setDepth(1);
    this.add.rectangle(655, 270, 3, 400, 0x334155).setDepth(2);
    this.add.text(WORK_ZONE.cx, 48, 'WORK ZONE', {
      fontFamily: 'Courier New', fontSize: '13px', color: '#86efac'
    }).setOrigin(0.5, 0).setDepth(1000);
    this.add.text(BREAK_ZONE.cx, 48, 'BREAK ROOM', {
      fontFamily: 'Courier New', fontSize: '13px', color: '#93c5fd'
    }).setOrigin(0.5, 0).setDepth(1000);

    // Coffee machine + benches -- Kenney's dungeon pack has neither, so
    // they're drawn procedurally in createPixelTextures() to match scale.
    this.add.image(BREAK_ZONE.cx, 130, 'coffee_machine').setScale(2.4).setOrigin(0.5, 1).setDepth(130);
    this.add.image(BREAK_ZONE.cx - 45, 260, 'bench').setScale(2).setOrigin(0.5, 1).setDepth(259);
    this.add.image(BREAK_ZONE.cx + 45, 400, 'bench').setScale(2).setOrigin(0.5, 1).setDepth(399);

    ROOMS.forEach((room, i) => {
      const deskX = room.x, deskY = room.y - 20;
      const chairX = room.x, chairY = room.y + 15;

      // Desk with a laptop on it -- Kenney's dungeon pack has no laptop
      // sprite, so it's drawn procedurally in createPixelTextures() to
      // match the same pixel-art scale/palette.
      const furnitureKey = i % 2 === 0 ? 'furniture_dresser' : 'furniture_desk';
      this.add.image(deskX, deskY, furnitureKey).setScale(2).setOrigin(0.5, 1).setDepth(deskY);
      this.add.image(deskX, deskY - 15, 'laptop').setScale(2).setOrigin(0.5, 1).setDepth(deskY + 1);

      // Simple drawn chair in front of the desk.
      this.add.rectangle(chairX, chairY + 8, 16, 10, 0x5b3a29).setStrokeStyle(1, 0x3a2417).setDepth(chairY - 1);

      this.add.text(deskX, deskY - 55, room.name, {
        fontFamily: 'Courier New', fontSize: '12px', color: '#f8fafc'
      }).setOrigin(0.5, 0).setDepth(1000);
      this.add.text(deskX, deskY - 42, room.agent, {
        fontFamily: 'Courier New', fontSize: '9px', color: '#94a3b8'
      }).setOrigin(0.5, 0).setDepth(1000);

      // Agent sprite: real chibi character art, colored/styled per role
      // (Kenney's Tiny Dungeon pack -- see assets/CREDITS.md).
      const sprite = this.add.image(chairX, chairY, room.charKey).setScale(2).setDepth(chairY);

      const entry = {
        sprite, room, working: false, wandering: true,
        chairPos: { x: chairX, y: chairY }, workTimer: null, bobTween: null,
      };
      this.roomSprites[room.key] = entry;

      // Idle wander walks the agent over to the break room instead of
      // pacing at their own desk, so "not working" reads as a real break,
      // not just idling in place. Staggered start so they don't all move
      // in lockstep.
      this.time.delayedCall(Phaser.Math.Between(0, 1500), () => this.wander(entry));
    });

    // Package sprite used for handoff / loop animations between rooms
    this.package = this.add.rectangle(-100, -100, 16, 16, 0xffffff).setDepth(2000);
  }

  // Draws small pixel-art props Kenney's dungeon pack doesn't include
  // (laptop, teacup) at the same scale/palette as the real sprite sheets.
  createPixelTextures() {
    const g = this.make.graphics({ x: 0, y: 0, add: false });

    g.clear();
    g.fillStyle(0x334155); g.fillRect(0, 5, 14, 4);   // keyboard/base
    g.fillStyle(0x0f172a); g.fillRect(1, 0, 12, 5);   // screen bezel
    g.fillStyle(0x38bdf8); g.fillRect(2, 1, 10, 3);   // screen glow
    g.generateTexture('laptop', 14, 9);

    g.clear();
    g.fillStyle(0xf1f5f9); g.fillRect(1, 2, 9, 6);    // cup body
    g.fillStyle(0x92400e); g.fillRect(2, 3, 7, 2);    // tea
    g.fillStyle(0xf1f5f9); g.fillRect(9, 3, 2, 3);    // handle
    g.generateTexture('teacup', 12, 8);

    g.clear();
    g.fillStyle(0x1e293b); g.fillRect(0, 0, 12, 3);   // top lid
    g.fillStyle(0x475569); g.fillRect(0, 2, 12, 12);  // machine body
    g.fillStyle(0xdc2626); g.fillRect(9, 5, 2, 2);     // power light
    g.fillStyle(0x0f172a); g.fillRect(2, 10, 8, 3);    // drip tray
    g.fillStyle(0x92400e); g.fillRect(4, 11, 4, 1);    // pot liquid hint
    g.generateTexture('coffee_machine', 12, 14);

    g.clear();
    g.fillStyle(0x581c0c); g.fillRect(0, 0, 26, 4);   // backrest
    g.fillStyle(0x7c2d12); g.fillRect(0, 4, 26, 6);   // seat
    g.generateTexture('bench', 26, 10);

    g.destroy();
  }

  // Random-walks a sprite within the break room only -- this is the
  // "resting" behavior, so it deliberately does NOT roam the whole floor;
  // agents physically leave their desk and walk over to the break room
  // (coffee machine / benches) instead of idling in place.
  wander(entry) {
    if (!entry.wandering) return;
    const BASE_SCALE = 2;
    const sprite = entry.sprite;
    const { minX, maxX, minY, maxY } = BREAK_ZONE;
    const step = () => {
      if (!entry.wandering) return;
      const tx = Phaser.Math.Between(minX, maxX);
      const ty = Phaser.Math.Between(minY, maxY);
      const dist = Phaser.Math.Distance.Between(sprite.x, sprite.y, tx, ty);
      const duration = Phaser.Math.Clamp(dist * 15, 600, 3200);
      sprite.setScale(tx < sprite.x ? -BASE_SCALE : BASE_SCALE, BASE_SCALE);
      this.tweens.add({
        targets: sprite, x: tx, y: ty, duration, ease: 'Sine.easeInOut',
        onUpdate: () => sprite.setDepth(sprite.y),
        onComplete: () => {
          if (!entry.wandering) return;
          // Occasionally pause at the coffee machine for a cup -- a
          // visible cup appears next to whoever isn't currently working.
          if (Phaser.Math.Between(0, 100) < 35) this.showTea(entry);
          this.time.delayedCall(Phaser.Math.Between(1200, 3500), step);
        }
      });
    };
    step();
  }

  showTea(entry) {
    const key = 'tea_' + entry.room.key;
    if (this.bubbles[key]) this.bubbles[key].destroy();
    const cup = this.add.image(entry.sprite.x + 14, entry.sprite.y - 4, 'teacup')
      .setScale(1.6).setDepth(entry.sprite.y + 1);
    this.bubbles[key] = cup;
    this.time.delayedCall(2200, () => { cup.destroy(); delete this.bubbles[key]; });
  }

  // Toggles an agent between "working" (seated at their own desk, laptop
  // lit, small typing bob) and "relaxing" (free-roaming the shared floor,
  // occasional tea break) -- driven by real pipeline activity, not a timer
  // for its own sake: working=true resets a 20s idle timeout each time a
  // fresh event lands, so the pose tracks actual activity.
  setWorking(key, working) {
    const entry = this.roomSprites[key];
    if (!entry) return;

    if (entry.workTimer) { entry.workTimer.remove(false); entry.workTimer = null; }
    if (working) entry.workTimer = this.time.delayedCall(20000, () => this.setWorking(key, false));

    if (entry.working === working) return; // already in that state, timer just refreshed
    entry.working = working;
    entry.wandering = !working;

    const sprite = entry.sprite;
    this.tweens.killTweensOf(sprite);
    if (entry.bobTween) { entry.bobTween.remove(); entry.bobTween = null; }

    if (working) {
      sprite.setScale(2, 2);
      this.tweens.add({
        targets: sprite, x: entry.chairPos.x, y: entry.chairPos.y, duration: 700, ease: 'Sine.easeInOut',
        onUpdate: () => sprite.setDepth(sprite.y),
        onComplete: () => {
          entry.bobTween = this.tweens.add({
            targets: sprite, y: entry.chairPos.y - 2, duration: 260, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
          });
        }
      });
    } else {
      this.time.delayedCall(250, () => this.wander(entry));
    }
  }

  showBubble(roomKey, text, color = '#e2e8f0') {
    const entry = this.roomSprites[roomKey];
    if (!entry) return;
    if (this.bubbles[roomKey]) this.bubbles[roomKey].destroy();
    const sx = Phaser.Math.Clamp(entry.sprite.x - 95, 10, this.scale.width - 210);
    const sy = Math.max(entry.sprite.y - 60, 10);
    const bubble = this.add.text(sx, sy, text, {
      fontFamily: 'Courier New', fontSize: '11px', color, backgroundColor: '#000000cc',
      padding: { x: 6, y: 4 }, wordWrap: { width: 190 }
    }).setDepth(2000);
    this.bubbles[roomKey] = bubble;
    this.time.delayedCall(4000, () => { bubble.destroy(); delete this.bubbles[roomKey]; });
  }

  walkPackage(fromKey, toKey, tint = 0xffffff, onDone) {
    const from = this.roomSprites[fromKey].room;
    const to = this.roomSprites[toKey].room;
    this.package.setFillStyle(tint);
    this.package.setPosition(from.x, from.y);
    this.package.setVisible(true);
    this.tweens.add({
      targets: this.package, x: to.x, y: to.y, duration: 1200, ease: 'Sine.easeInOut',
      onComplete: () => { this.package.setVisible(false); if (onDone) onDone(); }
    });
  }

  setWaiting(reason) {
    const banner = document.getElementById('waiting-banner');
    if (reason) {
      banner.textContent = `⏸ WAITING ON YOU — ${reason}`;
      banner.style.display = 'block';
    } else {
      banner.style.display = 'none';
    }
  }

  ticker(text) {
    document.getElementById('ticker-text').textContent = text;
  }

  // Plays one real event from /api/pipeline-events (see the poller below,
  // driven by GitHub's actual activity feed instead of a scripted demo).
  playEvent(room, text) {
    if (!this.roomSprites[room]) room = 'code_vault'; // fallback for unmapped rooms
    this.showBubble(room, text, '#e2e8f0');
    this.ticker(text);
    this.setWorking(room, true);
  }
}

const retrodevGame = new Phaser.Game({
  type: Phaser.AUTO,
  width: 860,
  height: 520,
  parent: 'game-container',
  backgroundColor: '#0b0e14',
  scene: [PipelineScene],
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
});
// Exposed so the real-event pollers below can drive the Phaser scene
// without needing to know about it directly.
window.retrodevTicker = (text) => {
  const scene = retrodevGame.scene.keys.pipeline;
  if (scene) scene.ticker(text);
};
window.retrodevPlayEvent = (room, text) => {
  const scene = retrodevGame.scene.keys.pipeline;
  if (scene) scene.playEvent(room, text);
};
window.retrodevSetWaiting = (reason) => {
  const scene = retrodevGame.scene.keys.pipeline;
  if (scene) scene.setWaiting(reason);
};

// --- Requirement submission form -> /api/submit-requirement ---
// The operator secret is stored only in this browser's localStorage; it's
// never bundled into the page source. This is a lightweight deterrent
// (single-operator app per PRD v1), not real auth — don't reuse this
// pattern if this ever becomes multi-user.
(function () {
  const reqInput = document.getElementById('req-input');
  const secretInput = document.getElementById('secret-input');
  const submitBtn = document.getElementById('req-submit');
  const status = document.getElementById('submit-status');

  const savedSecret = localStorage.getItem('retrodev_secret');
  if (savedSecret) secretInput.value = savedSecret;

  submitBtn.addEventListener('click', async () => {
    const requirement = reqInput.value.trim();
    const secret = secretInput.value.trim();
    if (!requirement) { status.textContent = 'Enter a requirement first.'; status.style.color = '#f87171'; return; }
    if (!secret) { status.textContent = 'Enter the operator secret.'; status.style.color = '#f87171'; return; }

    localStorage.setItem('retrodev_secret', secret);
    submitBtn.disabled = true;
    status.textContent = 'Sending to Product Manager...';
    status.style.color = '#93c5fd';

    try {
      const res = await fetch('/api/submit-requirement', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-retro-secret': secret },
        body: JSON.stringify({ requirement }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      status.textContent = `Opened ${data.issue_url} — PM will pick it up on its next scheduled run.`;
      status.style.color = '#4ade80';
      reqInput.value = '';
    } catch (err) {
      status.textContent = `Failed: ${err.message}`;
      status.style.color = '#f87171';
    } finally {
      submitBtn.disabled = false;
    }
  });
})();

// --- Poll /api/pipeline-status for real "awaiting-human" items ---
// Renders a pulsing "REQUIRES YOUR CONFIRMATION" badge with an inline
// reply box per pending issue (PRs link out to GitHub instead, since
// merging isn't something to do from a text box). Polling, not a
// websocket, per PRD v1's cron-based/free-tier-first design.
(function () {
  const panel = document.getElementById('confirm-panel');
  const itemsEl = document.getElementById('confirm-items');
  const secretInput = document.getElementById('secret-input');
  let lastCount = 0;

  // Issue numbers you've already replied to, persisted so a page reload
  // doesn't forget and show the reply box again. Cleared automatically
  // once the issue drops out of "pending" (i.e. the agent removed the
  // awaiting-human label after processing your answer).
  const answeredKey = 'retrodev_answered_issues';
  const answered = new Set(JSON.parse(localStorage.getItem(answeredKey) || '[]'));
  function saveAnswered() { localStorage.setItem(answeredKey, JSON.stringify([...answered])); }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(pending) {
    // Forget answered-flags for anything no longer pending (resolved).
    const stillPending = new Set(pending.map((i) => String(i.number)));
    let changed = false;
    for (const n of [...answered]) { if (!stillPending.has(n)) { answered.delete(n); changed = true; } }
    if (changed) saveAnswered();

    if (!pending.length) { panel.style.display = 'none'; itemsEl.innerHTML = ''; return; }
    panel.style.display = 'block';
    itemsEl.innerHTML = pending.map((item) => {
      const isAnswered = answered.has(String(item.number));
      return `
      <div class="item${isAnswered ? ' answered' : ''}" data-issue="${item.number}">
        <div class="title">#${item.number} — ${escapeHtml(item.title)}</div>
        ${isAnswered ? '<div class="flagged">✓ FLAGGED — ANSWER SENT, AWAITING PIPELINE</div>' : ''}
        <div class="snippet">${escapeHtml(item.snippet)}</div>
        ${item.is_pull_request
          ? `<a href="${item.url}" target="_blank" rel="noopener">Review &amp; merge on GitHub →</a>`
          : (isAnswered
              ? `<a href="${item.url}" target="_blank" rel="noopener">(view thread on GitHub)</a>`
              : `<textarea rows="2" placeholder="Type your answer/decision..."></textarea>
                 <button data-action="answer">Send answer</button>
                 <a href="${item.url}" target="_blank" rel="noopener" style="margin-left:8px;">(or view on GitHub)</a>
                 <div class="status"></div>`
            )
        }
      </div>
    `;
    }).join('');
  }

  itemsEl.addEventListener('click', async (e) => {
    if (e.target.dataset.action !== 'answer') return;
    const itemEl = e.target.closest('.item');
    const issueNumber = itemEl.dataset.issue;
    const textarea = itemEl.querySelector('textarea');
    const statusEl = itemEl.querySelector('.status');
    const answer = textarea.value.trim();
    const secret = secretInput.value.trim();
    if (!answer) { statusEl.textContent = 'Type an answer first.'; return; }
    if (!secret) { statusEl.textContent = 'Enter operator secret in the submit panel first.'; return; }

    e.target.disabled = true;
    statusEl.textContent = 'Sending...';
    try {
      const res = await fetch('/api/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-retro-secret': secret },
        body: JSON.stringify({ issue_number: issueNumber, answer }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      answered.add(String(issueNumber));
      saveAnswered();
      textarea.value = '';
      poll(); // re-render immediately so the "FLAGGED" state shows without waiting for the next 15s tick
    } catch (err) {
      statusEl.textContent = `Failed: ${err.message}`;
    } finally {
      e.target.disabled = false;
    }
  });

  async function poll() {
    try {
      const res = await fetch('/api/pipeline-status', { cache: 'no-store' });
      const data = await res.json();
      render(data.pending || []);
      const pending = data.pending || [];
      if (pending.length !== lastCount) {
        lastCount = pending.length;
        window.retrodevTicker && window.retrodevTicker(
          lastCount ? `${lastCount} item(s) need your confirmation` : 'All clear — nothing waiting on you'
        );
      }
      window.retrodevSetWaiting && window.retrodevSetWaiting(
        pending.length ? `#${pending[0].number} — ${pending[0].title}` : null
      );
    } catch (e) { /* transient network errors: just try again next poll */ }
  }
  poll();
  setInterval(poll, 15000);
})();

// --- Poll /api/pipeline-events for the real room animations + the
// ChatDev-style persistent dialogue transcript in the sidebar. ---
// Replaces the old scripted mock sequence with GitHub's actual activity.
(function () {
  const lastSeenKey = 'retrodev_last_event_ts';
  let lastSeen = localStorage.getItem(lastSeenKey) || '';

  const ROOM_META = {
    planning_deck:    { label: 'Priya (Product Manager)', color: '#3b82f6' },
    design_studio:    { label: 'Dara (Designer)',         color: '#14b8a6' },
    code_vault:       { label: 'Dev (Developer)',         color: '#f59e0b' },
    sandbox_lab:      { label: 'Quinn (QA Tester)',       color: '#ef4444' },
    deploy_bay:       { label: 'Devon (DevOps)',          color: '#8b5cf6' },
    uat_lounge:       { label: 'Uma (UAT Coordinator)',   color: '#06b6d4' },
    broadcast_studio: { label: 'Sasha (Social Expert)',   color: '#ec4899' },
  };
  const logEl = document.getElementById('dialogue-log');
  const MAX_LOG_ENTRIES = 100;

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function appendToLog(e) {
    const meta = ROOM_META[e.room] || { label: e.room, color: '#94a3b8' };
    const time = e.ts ? new Date(e.ts).toLocaleTimeString() : '';
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = `
      <span class="role" style="background:${meta.color}">${escapeHtml(meta.label)}</span>
      <span class="ts">${time}</span>
      <div class="bubble" style="border-left-color:${meta.color}">${escapeHtml(e.text)}</div>
    `;
    logEl.appendChild(div);
    while (logEl.children.length > MAX_LOG_ENTRIES) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function poll() {
    try {
      const res = await fetch('/api/pipeline-events', { cache: 'no-store' });
      const data = await res.json();
      const events = data.events || [];
      const fresh = lastSeen ? events.filter((e) => e.ts > lastSeen) : events;
      fresh.forEach((e, i) => {
        appendToLog(e);
        setTimeout(() => window.retrodevPlayEvent && window.retrodevPlayEvent(e.room, e.text), i * 1500);
      });
      if (events.length) {
        lastSeen = events[events.length - 1].ts;
        localStorage.setItem(lastSeenKey, lastSeen);
      }
    } catch (e) { /* transient network errors: just try again next poll */ }
  }
  poll();
  setInterval(poll, 15000);
})();
</script>
